<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Stylized R mark with gold rising bars -->
  <g transform="translate(60,10)">
    <path d="M170 20 C170 20 210 -10 260 10 C310 30 300 90 260 110 C220 130 180 120 170 140" fill="#0b3a66" />
    <g transform="translate(-10,40)">
      <rect x="120" y="40" width="16" height="60" rx="2" fill="#c7972b" />
      <rect x="140" y="30" width="16" height="70" rx="2" fill="#c7972b" />
      <rect x="160" y="20" width="16" height="80" rx="2" fill="#c7972b" />
      <path d="M96 125 L210 40" stroke="#c7972b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>

  <!-- Company name text -->
  <g transform="translate(360,160)">
    <text x="0" y="0" font-family="Poppins, Arial, Helvetica, sans-serif" font-weight="700" font-size="48" fill="#0b3a66">Rise </text>
    <text x="120" y="0" font-family="Poppins, Arial, Helvetica, sans-serif" font-weight="700" font-size="48" fill="#c7972b">Financial </text>
    <text x="360" y="0" font-family="Poppins, Arial, Helvetica, sans-serif" font-weight="700" font-size="48" fill="#0b3a66">Services</text>
  </g>

  <!-- small tagline optional -->
  <text x="360" y="210" font-family="Poppins, Arial, Helvetica, sans-serif" font-size="18" fill="#6b6b6b">Home & Property Loans</text>
</svg>
